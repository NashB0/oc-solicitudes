<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OC Solicitudes</title>
<meta name="theme-color" content="#c9a86a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root {
    --gold: #c9a86a;
    --gold-light: #f2e0b4;
    --gold-dark: #8a6d3b;
    --gold-metal: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 45%, var(--gold-dark) 100%);
    --gold-border-metal: linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-dark));
    --bg: #121212;
    --bg-card: #1e1e1e;
    --text: #f5f5f5;
    --text-dim: #999;
  }
  .texto-metal {
    background: var(--gold-metal);
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--gold);
    -webkit-text-fill-color: transparent;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }
  #loginScreen {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    gap:16px;
  }
  #loginScreen .logo { width:96px; height:96px; margin-bottom:8px; }
  #loginScreen h1 {
    font-size:20px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:24px;
  }
  #loginScreen input {
    width:100%;
    max-width:320px;
    padding:14px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #333;
    background:var(--bg-card);
    color:var(--text);
    font-size:16px;
  }
  #loginScreen button {
    width:100%;
    max-width:320px;
    padding:14px;
    border:none;
    border-radius:8px;
    background: var(--gold-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.4);
    color:#121212;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:15px;
  }
  #loginError { color:#e05c5c; font-size:13px; min-height:18px; }
  #app { display:none; flex-direction:column; flex:1; min-height:100vh; }
  header {
    padding:18px 16px 14px;
    text-align:center;
    border-bottom:1px solid #262626;
  }
  header h1 {
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--gold);
  }
  main { flex:1; padding:16px; padding-bottom:90px; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .placeholder { color: var(--text-dim); text-align:center; margin-top:60px; font-size:14px; }
  nav.bottom-nav {
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    background: var(--bg-card);
    border-top:1px solid #262626;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  nav.bottom-nav button {
    flex:1;
    background:none;
    border:none;
    color: var(--text-dim);
    padding:12px 4px 10px;
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  nav.bottom-nav button.active { color: var(--gold); }
  nav.bottom-nav svg { width:22px; height:22px; }

  form label { display:block; margin-bottom:14px; font-size:13px; color:var(--text-dim); }
  form input[type="text"], form input[type="date"], form input[type="number"], form textarea {
    width:100%; margin-top:6px; padding:12px; border-radius:8px; border:1px solid #333;
    background:var(--bg-card); color:var(--text); font-size:15px; font-family:inherit;
  }
  form textarea { resize:vertical; }
  fieldset { border:1px solid #333; border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  fieldset legend { padding:0 6px; font-size:13px; color:var(--text-dim); }
  label.radio { display:inline-flex; align-items:center; gap:6px; margin-right:14px; margin-bottom:6px; font-size:14px; color:var(--text); }
  label.radio input { width:auto; }
  form button[type="submit"] {
    width:100%; padding:14px; border:none; border-radius:8px; background: var(--gold-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.4);
    color:#121212; font-weight:bold; letter-spacing:1px; text-transform:uppercase; font-size:15px; margin-top:6px;
  }
  .msg { min-height:20px; margin-top:10px; font-size:13px; }
  .msg.ok { color:#7fd88f; }
  .msg.error { color:#e05c5c; }
  .adjuntos-preview { display:flex; flex-wrap:wrap; gap:10px; margin: -6px 0 14px; }
  .adjuntos-preview .adjunto-item { position:relative; width:72px; height:54px; }
  .adjuntos-preview .adjunto-item img { width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid #333; display:block; }
  .adjuntos-preview .btn-quitar-adjunto {
    position:absolute; top:-7px; right:-7px;
    width:20px; height:20px; border-radius:50%;
    background:#e05c5c; color:#fff; border:2px solid var(--bg);
    font-size:12px; line-height:1; padding:0;
  }
  .adjuntos-preview .file-chip { font-size:11px; color:var(--text-dim); border:1px solid #333; padding:4px 8px; border-radius:6px; }

  .btn-agregar-foto {
    width:100%;
    padding:12px;
    border:2px solid var(--gold);
    border-radius:8px;
    background:transparent;
    color: var(--gold);
    font-weight:bold;
    font-size:13px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:10px;
    box-shadow: 0 0 6px rgba(201,168,106,0.25);
  }

  .modal-camara {
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:1000;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .camara-marco-wrap {
    width:100%;
    max-width:480px;
    aspect-ratio: 4 / 3;
    position:relative;
    overflow:hidden;
    background:#000;
  }
  .camara-marco-wrap video {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .camara-marco {
    position:absolute;
    inset:0;
    border:3px solid var(--gold);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.4), 0 0 10px rgba(201,168,106,0.4);
    pointer-events:none;
  }
  .camara-controles {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:24px;
    width:100%;
  }
  .btn-camara-disparar {
    width:64px; height:64px; border-radius:50%;
    background:#fff; border:4px solid var(--gold);
  }
  .btn-camara-secundario {
    background:transparent; border:1px solid #fff; color:#fff;
    padding:10px 16px; border-radius:8px; font-size:13px;
  }

  .modal-firma {
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:1000;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    gap:16px;
  }
  .modal-firma h2 {
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    text-align:center;
  }
  .firma-wrap {
    width:100%;
    max-width:480px;
    aspect-ratio: 600 / 260;
    background:#fff;
    border-radius:8px;
    border:3px solid var(--gold);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.15), 0 0 10px rgba(201,168,106,0.4);
    overflow:hidden;
  }
  .firma-wrap canvas {
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .firma-ayuda {
    color:#ccc;
    font-size:12px;
    text-align:center;
  }
  .firma-controles {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-firma-confirmar {
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background: var(--gold-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.4);
    color:#121212;
    font-weight:bold;
    font-size:13px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .card {
    background:var(--bg-card); border:1px solid #262626; border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .card .card-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px; }
  .card .card-title { font-weight:bold; color:var(--gold); font-size:14px; }
  .card .card-date { font-size:11px; color:var(--text-dim); white-space:nowrap; }
  .card .card-row { font-size:13px; color:var(--text); margin-bottom:2px; }
  .badge-urgente { display:inline-block; background:#e05c5c; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:6px; letter-spacing:0.5px; text-transform:uppercase; vertical-align:middle; }

  .btn-dictar {
    width:100%;
    padding:14px;
    border:2px solid var(--gold);
    border-radius:8px;
    background:transparent;
    color: var(--gold);
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:14px;
    margin-bottom:8px;
    box-shadow: 0 0 6px rgba(201,168,106,0.25);
  }
  .btn-dictar.grabando {
    background: var(--gold-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.4);
    color:#121212;
    animation: pulsoDictado 1s infinite;
  }
  @keyframes pulsoDictado {
    0%, 100% { opacity:1; }
    50% { opacity:0.55; }
  }
  #dictadoEstado { margin-bottom:16px; }
  .card .btn-generar-pdf {
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background: var(--gold-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.4);
    color:#121212;
    font-weight:bold;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .card .card-estado {
    font-size:10px;
    color: var(--text-dim);
    margin-top:8px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

  <div id="loginScreen">
    <img class="logo" src="icon-192.png" alt="OC Solicitudes">
    <h1 class="texto-metal">OC Solicitudes</h1>
    <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="intentarLogin()">Ingresar</button>
    <div id="loginError"></div>
  </div>

  <div id="app">
    <header>
      <h1 id="tabTitle" class="texto-metal">Inicio</h1>
    </header>
    <main>
      <div id="tab-inicio" class="tab-content active">
        <form id="formSolicitud" onsubmit="return guardarSolicitud(event)">
          <button type="button" id="btnDictar" class="btn-dictar" onclick="iniciarDictado()">🎤 Dictar solicitud</button>
          <div id="dictadoEstado" class="msg"></div>

          <label>EESS / Destino
            <input type="text" id="f_eess" required>
          </label>

          <label>Encargado
            <input type="text" id="f_encargado" required>
          </label>

          <label>Fecha
            <input type="date" id="f_fecha" required>
          </label>

          <fieldset>
            <legend>Categoría</legend>
            <label class="radio"><input type="radio" name="f_categoria" value="Insumos" required> Insumos</label>
            <label class="radio"><input type="radio" name="f_categoria" value="Compras para infraestructura"> Compras para infraestructura</label>
            <label class="radio"><input type="radio" name="f_categoria" value="Obras"> Obras</label>
            <label class="radio"><input type="radio" name="f_categoria" value="Mercaderías"> Mercaderías</label>
          </fieldset>

          <label>Producto / Servicio solicitado
            <input type="text" id="f_producto" required>
          </label>

          <label>Cantidad
            <input type="number" id="f_cantidad" min="1" step="1" required>
          </label>

          <label>Fecha en que se necesita
            <input type="date" id="f_fechaNecesaria" required>
          </label>

          <label>Motivo / Justificación
            <textarea id="f_motivo" rows="3" required></textarea>
          </label>

          <label>Características / Especificaciones
            <textarea id="f_caracteristicas" rows="3"></textarea>
          </label>

          <label>Adjuntos (fotos, medidas, documentación)</label>
          <button type="button" class="btn-agregar-foto" onclick="abrirCamara()">📷 Sacar foto (marco 4:3)</button>
          <input type="file" id="f_adjuntos_fallback" accept="image/*" style="display:none" onchange="procesarArchivosGaleria(event)">
          <div id="f_adjuntosPreview" class="adjuntos-preview"></div>

          <fieldset>
            <legend>¿Es urgente?</legend>
            <label class="radio"><input type="radio" name="f_urgente" value="si" onchange="toggleMotivoUrgencia()"> Sí</label>
            <label class="radio"><input type="radio" name="f_urgente" value="no" checked onchange="toggleMotivoUrgencia()"> No</label>
          </fieldset>

          <label id="f_motivoUrgenciaWrap" style="display:none">
            Motivo de la urgencia
            <input type="text" id="f_motivoUrgencia">
          </label>

          <button type="submit">Generar solicitud</button>
          <div id="f_msg" class="msg"></div>
        </form>
      </div>
      <div id="tab-generadas" class="tab-content">
        <p class="placeholder" id="generadasVacio">Todavía no generaste ninguna solicitud.</p>
        <div id="listaGeneradas"></div>
      </div>
      <div id="tab-historial" class="tab-content">
        <p class="placeholder" id="historialVacio">Todavía no enviaste ninguna orden.</p>
        <div id="listaHistorial"></div>
      </div>
    </main>
    <nav class="bottom-nav">
      <button id="nav-inicio" class="active" onclick="mostrarTab('inicio')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Inicio
      </button>
      <button id="nav-generadas" onclick="mostrarTab('generadas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        Generadas
      </button>
      <button id="nav-historial" onclick="mostrarTab('historial')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Historial
      </button>
    </nav>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const USUARIO_DEMO = "demo-oc";
  const CLAVE_DEMO = "123456";
  let adjuntosTemp = [];

  window.addEventListener('error', function(e) {
    const msg = document.getElementById('f_msg');
    if (msg) {
      msg.textContent = 'Error inesperado: ' + (e.message || 'sin detalle');
      msg.className = 'msg error';
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    const msg = document.getElementById('f_msg');
    if (msg) {
      msg.textContent = 'Error inesperado: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      msg.className = 'msg error';
    }
  });

  function intentarLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const errorBox = document.getElementById('loginError');

    if (user === USUARIO_DEMO && pass === CLAVE_DEMO) {
      errorBox.textContent = "";
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('app').style.display = "flex";
      document.getElementById('f_fecha').value = hoyISO();
      renderGeneradas();
      renderHistorial();
    } else {
      errorBox.textContent = "Usuario o contraseña incorrectos";
    }
  }

  const TITULOS = {
    inicio: "Inicio",
    generadas: "Órdenes generadas",
    historial: "Historial de Órdenes Enviadas"
  };

  function mostrarTab(id) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.remove('active'));

    document.getElementById('tab-' + id).classList.add('active');
    document.getElementById('nav-' + id).classList.add('active');
    document.getElementById('tabTitle').textContent = TITULOS[id];
  }

  function hoyISO() {
    const d = new Date();
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mes + '-' + dia;
  }

  function toggleMotivoUrgencia() {
    const sel = document.querySelector('input[name="f_urgente"]:checked');
    const urgente = sel ? sel.value : 'no';
    document.getElementById('f_motivoUrgenciaWrap').style.display = urgente === 'si' ? 'block' : 'none';
  }

  const RATIO_MARCO_FOTO = 4 / 3;

  function comprimirImagen(file, maxWidth, calidad) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          let sx = 0, sy = 0, sw = img.width, sh = img.height;
          const ratioActual = img.width / img.height;

          if (ratioActual > RATIO_MARCO_FOTO) {
            sw = img.height * RATIO_MARCO_FOTO;
            sx = (img.width - sw) / 2;
          } else {
            sh = img.width / RATIO_MARCO_FOTO;
            sy = (img.height - sh) / 2;
          }

          const w = maxWidth;
          const h = Math.round(w / RATIO_MARCO_FOTO);

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', calidad), ancho: w, alto: h });
        };
        img.onerror = function() { reject(new Error('No se pudo leer la imagen')); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { reject(new Error('No se pudo leer el archivo')); };
      reader.readAsDataURL(file);
    });
  }

  function renderAdjuntosPreview() {
    const preview = document.getElementById('f_adjuntosPreview');
    preview.innerHTML = '';
    adjuntosTemp.forEach((adj, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'adjunto-item';
      wrap.innerHTML =
        '<img src="' + adj.dataUrl + '">' +
        '<button type="button" class="btn-quitar-adjunto" onclick="quitarAdjunto(' + i + ')">×</button>';
      preview.appendChild(wrap);
    });
  }

  function quitarAdjunto(i) {
    adjuntosTemp.splice(i, 1);
    renderAdjuntosPreview();
  }

  function procesarArchivosGaleria(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      comprimirImagen(file, 900, 0.7).then(resultado => {
        adjuntosTemp.push({ nombre: file.name, dataUrl: resultado.dataUrl, ancho: resultado.ancho, alto: resultado.alto });
        renderAdjuntosPreview();
      }).catch(function() {
        const preview = document.getElementById('f_adjuntosPreview');
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.textContent = file.name + ' (no se pudo procesar)';
        preview.appendChild(chip);
      });
    });
    e.target.value = '';
  }

  let streamCamara = null;
  let camaraFacing = 'environment';

  async function abrirCamara() {
    const estado = document.getElementById('f_msg');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Este navegador no permite abrir la cámara acá. Vas a elegir una foto de la galería en su lugar.');
      document.getElementById('f_adjuntos_fallback').click();
      return;
    }
    const modal = document.getElementById('modalCamara');
    const video = document.getElementById('videoCamara');
    try {
      streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camaraFacing }, audio: false });
      video.srcObject = streamCamara;
      video.play().catch(function() {});
      modal.style.display = 'flex';
    } catch (err) {
      alert('No se pudo abrir la cámara (' + err.message + '). Vas a elegir una foto de la galería en su lugar.');
      document.getElementById('f_adjuntos_fallback').click();
    }
  }

  function cerrarCamara() {
    document.getElementById('modalCamara').style.display = 'none';
    if (streamCamara) {
      streamCamara.getTracks().forEach(t => t.stop());
      streamCamara = null;
    }
  }

  async function cambiarCamara() {
    camaraFacing = camaraFacing === 'environment' ? 'user' : 'environment';
    if (streamCamara) {
      streamCamara.getTracks().forEach(t => t.stop());
    }
    try {
      streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camaraFacing }, audio: false });
      const video = document.getElementById('videoCamara');
      video.srcObject = streamCamara;
      video.play().catch(function() {});
    } catch (err) {
      alert('No se pudo cambiar de cámara: ' + err.message);
    }
  }

  function capturarFoto() {
    const video = document.getElementById('videoCamara');
    let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;
    const ratioActual = video.videoWidth / video.videoHeight;

    if (ratioActual > RATIO_MARCO_FOTO) {
      sw = video.videoHeight * RATIO_MARCO_FOTO;
      sx = (video.videoWidth - sw) / 2;
    } else {
      sh = video.videoWidth / RATIO_MARCO_FOTO;
      sy = (video.videoHeight - sh) / 2;
    }

    const w = 900;
    const h = Math.round(w / RATIO_MARCO_FOTO);
    const canvas = document.getElementById('canvasCamara');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

    adjuntosTemp.push({ nombre: 'foto-' + Date.now() + '.jpg', dataUrl: dataUrl, ancho: w, alto: h });
    renderAdjuntosPreview();
    cerrarCamara();
  }

  function quitarAcentos(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  const CAMPOS_VOZ = [
    { clave: 'eess', patrones: ['estacion', 'eess', 'destino'], targetId: 'f_eess' },
    { clave: 'encargado', patrones: ['encargado'], targetId: 'f_encargado' },
    { clave: 'categoria', patrones: ['categoria'] },
    { clave: 'producto', patrones: ['producto', 'servicio'], targetId: 'f_producto' },
    { clave: 'cantidad', patrones: ['cantidad'], targetId: 'f_cantidad' },
    { clave: 'motivo', patrones: ['motivo', 'justificacion'], targetId: 'f_motivo' },
    { clave: 'caracteristicas', patrones: ['caracteristicas', 'especificaciones'], targetId: 'f_caracteristicas' },
    { clave: 'urgente', patrones: ['urgente'] }
  ];

  function interpretarVozFormulario(texto) {
    const textoNorm = quitarAcentos(texto.toLowerCase());
    const encontrados = [];
    CAMPOS_VOZ.forEach(campo => {
      campo.patrones.forEach(patron => {
        const idx = textoNorm.indexOf(patron);
        if (idx !== -1) {
          encontrados.push({ campo: campo, idx: idx, len: patron.length });
        }
      });
    });
    encontrados.sort((a, b) => a.idx - b.idx);

    const vistos = new Set();
    const unicos = encontrados.filter(e => {
      if (vistos.has(e.campo.clave)) return false;
      vistos.add(e.campo.clave);
      return true;
    });

    const resultados = {};
    unicos.forEach((e, i) => {
      const inicioValor = e.idx + e.len;
      const finValor = i + 1 < unicos.length ? unicos[i + 1].idx : texto.length;
      let valor = texto.substring(inicioValor, finValor);
      valor = valor.replace(/^[\s:,.-]+|[\s:,.-]+$/g, '');
      resultados[e.campo.clave] = valor;
    });
    return resultados;
  }

  function aplicarDictado(resultados) {
    CAMPOS_VOZ.forEach(campo => {
      if (campo.targetId && resultados[campo.clave]) {
        document.getElementById(campo.targetId).value = resultados[campo.clave];
      }
    });

    if (resultados.cantidad) {
      const numero = resultados.cantidad.match(/\d+/);
      if (numero) document.getElementById('f_cantidad').value = numero[0];
    }

    if (resultados.categoria) {
      const catTexto = quitarAcentos(resultados.categoria.toLowerCase());
      const opciones = [
        { valor: 'Insumos', match: 'insumos' },
        { valor: 'Compras para infraestructura', match: 'infraestructura' },
        { valor: 'Obras', match: 'obras' },
        { valor: 'Mercaderías', match: 'mercader' }
      ];
      const encontrada = opciones.find(o => catTexto.includes(o.match));
      if (encontrada) {
        const radio = document.querySelector('input[name="f_categoria"][value="' + encontrada.valor + '"]');
        if (radio) radio.checked = true;
      }
    }

    if (resultados.urgente) {
      const urgTexto = quitarAcentos(resultados.urgente.toLowerCase());
      let valor = null;
      if (urgTexto.includes('no')) valor = 'no';
      else if (urgTexto.includes('si')) valor = 'si';
      if (valor) {
        const radio = document.querySelector('input[name="f_urgente"][value="' + valor + '"]');
        if (radio) {
          radio.checked = true;
          toggleMotivoUrgencia();
        }
      }
    }
  }

  let reconocimientoVoz = null;

  function iniciarDictado() {
    const btn = document.getElementById('btnDictar');
    const estado = document.getElementById('dictadoEstado');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      estado.textContent = 'El dictado por voz solo funciona en Chrome.';
      estado.className = 'msg error';
      return;
    }

    if (reconocimientoVoz) {
      reconocimientoVoz.stop();
      return;
    }

    reconocimientoVoz = new SpeechRecognition();
    reconocimientoVoz.lang = 'es-AR';
    reconocimientoVoz.continuous = false;
    reconocimientoVoz.interimResults = false;

    btn.classList.add('grabando');
    estado.textContent = 'Escuchando... decí, por ejemplo: "estación Triángulo, encargado Javier Pérez, categoría insumos, producto detergente, cantidad 200, motivo reposición de stock"';
    estado.className = 'msg';

    reconocimientoVoz.onresult = function(event) {
      const texto = event.results[0][0].transcript;
      const resultados = interpretarVozFormulario(texto);
      aplicarDictado(resultados);
      estado.textContent = 'Se completó lo reconocido: "' + texto + '"';
      estado.className = 'msg ok';
    };

    reconocimientoVoz.onerror = function(event) {
      estado.textContent = 'No se pudo escuchar: ' + event.error;
      estado.className = 'msg error';
    };

    reconocimientoVoz.onend = function() {
      btn.classList.remove('grabando');
      reconocimientoVoz = null;
    };

    reconocimientoVoz.start();
  }

  function generarId() {
    return 'oc' + Date.now();
  }

  function guardarSolicitud(event) {
    event.preventDefault();
    const msg = document.getElementById('f_msg');
    try {
      const categoriaEl = document.querySelector('input[name="f_categoria"]:checked');
      const urgenteEl = document.querySelector('input[name="f_urgente"]:checked');

      if (!categoriaEl) {
        msg.textContent = 'Elegí una categoría';
        msg.className = 'msg error';
        return false;
      }

      const solicitud = {
        id: generarId(),
        eess: document.getElementById('f_eess').value.trim(),
        encargado: document.getElementById('f_encargado').value.trim(),
        fecha: document.getElementById('f_fecha').value,
        categoria: categoriaEl.value,
        producto: document.getElementById('f_producto').value.trim(),
        cantidad: document.getElementById('f_cantidad').value,
        fechaNecesaria: document.getElementById('f_fechaNecesaria').value,
        motivo: document.getElementById('f_motivo').value.trim(),
        caracteristicas: document.getElementById('f_caracteristicas').value.trim(),
        adjuntos: adjuntosTemp,
        urgente: urgenteEl ? urgenteEl.value : 'no',
        motivoUrgencia: document.getElementById('f_motivoUrgencia').value.trim(),
        estado: 'generada',
        creada: new Date().toISOString()
      };

      const lista = obtenerSolicitudes();
      lista.push(solicitud);

      try {
        guardarSolicitudes(lista);
      } catch (err) {
        msg.textContent = 'No se pudo guardar: las fotos ocupan demasiado espacio. Sacá menos fotos o de menor calidad e intentá de nuevo.';
        msg.className = 'msg error';
        return false;
      }

      document.getElementById('formSolicitud').reset();
      adjuntosTemp = [];
      renderAdjuntosPreview();
      document.getElementById('f_fecha').value = hoyISO();
      toggleMotivoUrgencia();

      msg.textContent = 'Solicitud generada correctamente';
      msg.className = 'msg ok';

      renderGeneradas();
      return false;
    } catch (err) {
      msg.textContent = 'Error inesperado al guardar: ' + err.message;
      msg.className = 'msg error';
      return false;
    }
  }

  function obtenerSolicitudes() {
    try {
      return JSON.parse(localStorage.getItem('oc_solicitudes') || '[]');
    } catch (e) {
      return [];
    }
  }

  function guardarSolicitudes(lista) {
    localStorage.setItem('oc_solicitudes', JSON.stringify(lista));
  }

  function renderGeneradas() {
    const lista = obtenerSolicitudes().filter(s => s.estado === 'generada');
    const cont = document.getElementById('listaGeneradas');
    const vacio = document.getElementById('generadasVacio');
    cont.innerHTML = '';

    if (lista.length === 0) {
      vacio.style.display = 'block';
      return;
    }
    vacio.style.display = 'none';

    lista.slice().reverse().forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-top">' +
          '<span class="card-title">' + s.producto + (s.urgente === 'si' ? '<span class="badge-urgente">Urgente</span>' : '') + '</span>' +
          '<span class="card-date">' + s.fecha + '</span>' +
        '</div>' +
        '<div class="card-row">' + s.eess + ' · ' + s.categoria + '</div>' +
        '<div class="card-row">Cantidad: ' + s.cantidad + '</div>' +
        '<div class="card-row">Encargado: ' + s.encargado + '</div>' +
        '<button class="btn-generar-pdf" onclick="abrirFirma(\'' + s.id + '\')">Firmar y enviar (PDF)</button>';
      cont.appendChild(card);
    });
  }

  function renderHistorial() {
    const lista = obtenerSolicitudes().filter(s => s.estado === 'enviada');
    const cont = document.getElementById('listaHistorial');
    const vacio = document.getElementById('historialVacio');
    cont.innerHTML = '';

    if (lista.length === 0) {
      vacio.style.display = 'block';
      return;
    }
    vacio.style.display = 'none';

    lista.slice().reverse().forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-top">' +
          '<span class="card-title">' + s.producto + (s.urgente === 'si' ? '<span class="badge-urgente">Urgente</span>' : '') + '</span>' +
          '<span class="card-date">' + s.fecha + '</span>' +
        '</div>' +
        '<div class="card-row">' + s.eess + ' · ' + s.categoria + '</div>' +
        '<div class="card-row">Cantidad: ' + s.cantidad + '</div>' +
        '<div class="card-row">Encargado: ' + s.encargado + '</div>' +
        '<div class="card-estado">Orden enviada</div>' +
        '<button class="btn-generar-pdf" onclick="descargarPDFDeNuevo(\'' + s.id + '\')">Descargar PDF de nuevo</button>';
      cont.appendChild(card);
    });
  }

  function generarPDFOrden(solicitud) {
    const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) {
      throw new Error('No se pudo cargar la librería de PDF (revisá tu conexión a internet)');
    }
    const doc = new jsPDFCtor();
    let y = 20;

    doc.setFontSize(18);
    doc.text('ORDEN DE COMPRA', 105, y, { align: 'center' });
    y += 8;

    doc.setFontSize(10);
    doc.setTextColor(90, 90, 90);
    doc.text('N.° ' + solicitud.id, 105, y, { align: 'center' });
    y += 14;

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(11);

    function linea(etiqueta, valor) {
      doc.setFont(undefined, 'bold');
      const textoEtiqueta = etiqueta + ':';
      doc.text(textoEtiqueta, 15, y);
      const anchoEtiqueta = doc.getTextWidth(textoEtiqueta);
      doc.setFont(undefined, 'normal');
      const xValor = 15 + anchoEtiqueta + 4;
      const anchoDisponible = 195 - xValor;
      const texto = doc.splitTextToSize(valor || '-', anchoDisponible);
      doc.text(texto, xValor, y);
      y += 7 * texto.length;
    }

    linea('EESS / Destino', solicitud.eess);
    linea('Encargado', solicitud.encargado);
    linea('Fecha', solicitud.fecha);
    linea('Categoría', solicitud.categoria);
    linea('Producto / Servicio', solicitud.producto);
    linea('Cantidad', String(solicitud.cantidad));
    linea('Fecha en que se necesita', solicitud.fechaNecesaria);
    linea('Motivo / Justificación', solicitud.motivo);
    linea('Características', solicitud.caracteristicas || '-');
    linea('Urgente', solicitud.urgente === 'si' ? ('Sí — ' + (solicitud.motivoUrgencia || '')) : 'No');

    y += 6;

    if (solicitud.adjuntos && solicitud.adjuntos.length) {
      if (y > 250) { doc.addPage(); y = 20; }
      doc.setFont(undefined, 'bold');
      doc.text('Adjuntos:', 15, y);
      y += 8;
      doc.setFont(undefined, 'normal');

      const anchoCelda = 60;
      const altoCelda = 45;
      let x = 15;
      solicitud.adjuntos.forEach(adj => {
        if (x + anchoCelda > 195) { x = 15; y += altoCelda + 8; }
        if (y + altoCelda > 280) { doc.addPage(); y = 20; x = 15; }

        let wImg = anchoCelda, hImg = altoCelda;
        if (adj.ancho && adj.alto) {
          const ratio = adj.ancho / adj.alto;
          const ratioCelda = anchoCelda / altoCelda;
          if (ratio > ratioCelda) {
            wImg = anchoCelda;
            hImg = anchoCelda / ratio;
          } else {
            hImg = altoCelda;
            wImg = altoCelda * ratio;
          }
        }

        try {
          doc.addImage(adj.dataUrl, 'JPEG', x, y, wImg, hImg);
        } catch (e) {
          // si una imagen puntual falla, seguimos con el resto
        }
        x += anchoCelda + 10;
      });
      y += altoCelda + 10;
    }

    if (solicitud.firma) {
      if (y > 230) { doc.addPage(); y = 20; }
      y += 4;
      doc.setFont(undefined, 'bold');
      doc.text('Firma del Encargado:', 15, y);
      y += 4;
      try {
        doc.addImage(solicitud.firma, 'PNG', 15, y, 70, 30);
      } catch (e) {
        // si la firma falla, seguimos sin bloquear el resto del PDF
      }
      y += 30;
      doc.setDrawColor(150, 150, 150);
      doc.line(15, y, 85, y);
      doc.setFontSize(9);
      doc.setTextColor(90, 90, 90);
      doc.text(solicitud.encargado || '', 15, y + 5);
      doc.setFontSize(11);
      doc.setTextColor(0, 0, 0);
      doc.setFont(undefined, 'normal');
    }

    doc.save('orden-de-compra-' + solicitud.id + '.pdf');
  }

  let firmaCtx = null;
  let firmaDibujando = false;
  let firmaTieneTrazo = false;
  let idPendienteFirma = null;

  function abrirFirma(id) {
    idPendienteFirma = id;
    const canvas = document.getElementById('canvasFirma');
    firmaCtx = canvas.getContext('2d');
    firmaCtx.fillStyle = '#ffffff';
    firmaCtx.fillRect(0, 0, canvas.width, canvas.height);
    firmaCtx.strokeStyle = '#000000';
    firmaCtx.lineWidth = 3;
    firmaCtx.lineCap = 'round';
    firmaCtx.lineJoin = 'round';
    firmaTieneTrazo = false;
    document.getElementById('modalFirma').style.display = 'flex';
  }

  function cerrarFirma() {
    document.getElementById('modalFirma').style.display = 'none';
    idPendienteFirma = null;
  }

  function limpiarFirma() {
    const canvas = document.getElementById('canvasFirma');
    firmaCtx.fillStyle = '#ffffff';
    firmaCtx.fillRect(0, 0, canvas.width, canvas.height);
    firmaTieneTrazo = false;
  }

  function posicionFirma(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    const escalaX = canvas.width / rect.width;
    const escalaY = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * escalaX,
      y: (evt.clientY - rect.top) * escalaY
    };
  }

  function firmaInicio(evt) {
    evt.preventDefault();
    const canvas = document.getElementById('canvasFirma');
    try { canvas.setPointerCapture(evt.pointerId); } catch (e) {}
    const pos = posicionFirma(canvas, evt);
    firmaDibujando = true;
    firmaTieneTrazo = true;
    firmaCtx.beginPath();
    firmaCtx.moveTo(pos.x, pos.y);
  }

  function firmaMover(evt) {
    if (!firmaDibujando) return;
    evt.preventDefault();
    const canvas = document.getElementById('canvasFirma');
    const pos = posicionFirma(canvas, evt);
    firmaCtx.lineTo(pos.x, pos.y);
    firmaCtx.stroke();
  }

  function firmaFin(evt) {
    firmaDibujando = false;
  }

  function confirmarFirma() {
    if (!firmaTieneTrazo) {
      alert('Necesitás firmar antes de continuar.');
      return;
    }
    const canvas = document.getElementById('canvasFirma');
    const firmaDataUrl = canvas.toDataURL('image/png');
    const id = idPendienteFirma;
    document.getElementById('modalFirma').style.display = 'none';
    idPendienteFirma = null;
    procesarEnvioConFirma(id, firmaDataUrl);
  }

  function procesarEnvioConFirma(id, firmaDataUrl) {
    const lista = obtenerSolicitudes();
    const idx = lista.findIndex(s => s.id === id);
    if (idx === -1) return;

    lista[idx].firma = firmaDataUrl;

    try {
      generarPDFOrden(lista[idx]);
    } catch (err) {
      alert('No se pudo generar el PDF: ' + err.message);
      return;
    }

    lista[idx].estado = 'enviada';
    lista[idx].fechaEnvio = new Date().toISOString();
    guardarSolicitudes(lista);

    renderGeneradas();
    renderHistorial();
  }

  function descargarPDFDeNuevo(id) {
    const lista = obtenerSolicitudes();
    const solicitud = lista.find(s => s.id === id);
    if (!solicitud) return;
    try {
      generarPDFOrden(solicitud);
    } catch (err) {
      alert('No se pudo generar el PDF: ' + err.message);
    }
  }
</script>

  <div id="modalCamara" class="modal-camara">
    <div class="camara-marco-wrap">
      <video id="videoCamara" autoplay playsinline muted></video>
      <div class="camara-marco"></div>
    </div>
    <canvas id="canvasCamara" style="display:none"></canvas>
    <div class="camara-controles">
      <button type="button" class="btn-camara-secundario" onclick="cerrarCamara()">Cancelar</button>
      <button type="button" class="btn-camara-disparar" onclick="capturarFoto()" aria-label="Sacar foto"></button>
      <button type="button" class="btn-camara-secundario" onclick="cambiarCamara()">🔄</button>
    </div>
  </div>

  <div id="modalFirma" class="modal-firma">
    <h2 class="texto-metal">Firmá para enviar la orden</h2>
    <div class="firma-wrap">
      <canvas id="canvasFirma" width="600" height="260"
        onpointerdown="firmaInicio(event)"
        onpointermove="firmaMover(event)"
        onpointerup="firmaFin(event)"
        onpointercancel="firmaFin(event)"
        onpointerleave="firmaFin(event)"></canvas>
    </div>
    <p class="firma-ayuda">Dibujá tu firma con el dedo dentro del recuadro</p>
    <div class="firma-controles">
      <button type="button" class="btn-camara-secundario" onclick="cerrarFirma()">Cancelar</button>
      <button type="button" class="btn-camara-secundario" onclick="limpiarFirma()">Limpiar</button>
      <button type="button" class="btn-firma-confirmar" onclick="confirmarFirma()">Confirmar y enviar</button>
    </div>
  </div>

</body>
